<!DOCTYPE html>
<html lang="en-us">
          <head>
            <base href="https://cdn.jsdelivr.net/gh/faralong/all@main/sandboxcity/">
            <script>
              const __originalURL = window.URL;
              window.URL = function(url, base) {
                if (base && (base === 'about:srcdoc' || base.includes('about:srcdoc') || base.startsWith('blob:'))) {
                  base = document.baseURI;
                }
                try { return new __originalURL(url, base); } catch (e) {
                  if (base) return new __originalURL(url, document.baseURI);
                  throw e;
                }
              };
              window.URL.createObjectURL = __originalURL.createObjectURL;
              window.URL.revokeObjectURL = __originalURL.revokeObjectURL;
            </script>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
            <link rel="stylesheet" href="TemplateData/style.css">
            <style>body{margin:0;overflow:hidden;background:#000;}</style>
          </head>
          <body class="noselect">
            <div id="unity-container" style="width:100vw; height:100vh; position:fixed; inset:0;">
              <canvas id="unity-canvas" style="width:100%; height:100%;"></canvas>
            </div>
            <div id="loading-cover" style="display:none;">
              <div id="unity-loading-bar">
                <div id="unity-logo"><img src="logo.png"></div>
                <br><br><br>
                <div id="unity-progress-bar-empty" style="display: none;">
                  <div id="unity-progress-bar-full"></div>
                </div>
                <div class="spinner"></div>
              </div>
            </div>
            <script src="https://cdn.jsdelivr.net/gh/faralong/all@main/sandboxcity/jszip.js"></script>
            <script>
              async function fetchAndCombineZip(binUrls) {
                const responses = await Promise.all(binUrls.map(url => fetch(url)));
                const buffers = await Promise.all(responses.map(res => res.arrayBuffer()));
                let totalLength = buffers.reduce((acc, buf) => acc + buf.byteLength, 0);
                let combined = new Uint8Array(totalLength);
                let offset = 0;
                for (let buf of buffers) {
                    combined.set(new Uint8Array(buf), offset);
                    offset += buf.byteLength;
                }
                return combined;
              }

              async function unzipWebpFromExternalBins(binUrls) {
                const blobUrls = {};
                const bytes = await fetchAndCombineZip(binUrls);
                const zip = await JSZip.loadAsync(bytes);
                for (const [filename, file] of Object.entries(zip.files)) {
                    if (!file.dir) {
                        let mime = '';
                        if (filename.endsWith('.js') || filename.endsWith('.mjs')) mime = 'text/javascript';
                        else if (filename.endsWith('.css')) mime = 'text/css';
                        else if (filename.endsWith('.html')) mime = 'text/html';
                        else if (filename.endsWith('.webp')) mime = 'image/webp';
                        else if (filename.endsWith('.png')) mime = 'image/png';
                        else if (filename.endsWith('.jpg') || filename.endsWith('.jpeg')) mime = 'image/jpeg';
                        const rawBlob = await file.async("blob");
                        const blob = mime ? new Blob([rawBlob], { type: mime }) : rawBlob;
                        const blobUrl = URL.createObjectURL(blob);
                        blobUrls[filename] = blobUrl;
                    }
                }
                return blobUrls;
              }

              let blobUrlss = "";
              let binParts = ["parts-1.bin", "parts-2.bin"];

              unzipWebpFromExternalBins(binParts).then(blobUrls => {
                blobUrlss = blobUrls;
                const ORIGINAL_CREATE_ELEMENT = document.createElement;
                const ORIGINAL_SET_ATTRIBUTE = Element.prototype.setAttribute;

                document.createElement = function(tagName) {
                    const el = ORIGINAL_CREATE_ELEMENT.call(this, tagName);
                    if (tagName.toLowerCase() === 'script') {
                        Object.defineProperty(el, 'src', {
                            set(newSrc) {
                                const filename = extractFilename(newSrc);
                                const replacement = blobUrlss[filename];
                                if (replacement) ORIGINAL_SET_ATTRIBUTE.call(el, 'src', replacement);
                                else ORIGINAL_SET_ATTRIBUTE.call(el, 'src', newSrc);
                            },
                            get() { return el.getAttribute('src'); },
                            configurable: true
                        });
                    }
                    return el;
                };

                Element.prototype.setAttribute = function(name, value) {
                    if (this.tagName === 'SCRIPT' && name === 'src') {
                        const filename = extractFilename(value);
                        const replacement = blobUrlss[filename];
                        if (replacement) return ORIGINAL_SET_ATTRIBUTE.call(this, name, replacement);
                    }
                    return ORIGINAL_SET_ATTRIBUTE.call(this, name, value);
                };

                function extractFilename(url) {
                    try { return new URL(url, location.href).pathname.split('/').pop(); }
                    catch { return url.split('/').pop(); }
                }

                const imageSrcDescriptor = Object.getOwnPropertyDescriptor(Image.prototype, 'src');
                Object.defineProperty(Image.prototype, 'src', {
                  set(value) { imageSrcDescriptor.set.call(this, rewriteURL(value)); },
                  get: imageSrcDescriptor.get, configurable: true, enumerable: true,
                });

                const scriptSrcDescriptor = Object.getOwnPropertyDescriptor(HTMLScriptElement.prototype, 'src');
                Object.defineProperty(HTMLScriptElement.prototype, 'src', {
                  set(value) { scriptSrcDescriptor.set.call(this, rewriteURL(value)); },
                  get: scriptSrcDescriptor.get, configurable: true, enumerable: true,
                });

                const linkHrefDescriptor = Object.getOwnPropertyDescriptor(HTMLLinkElement.prototype, 'href');
                Object.defineProperty(HTMLLinkElement.prototype, 'href', {
                  set(value) { linkHrefDescriptor.set.call(this, rewriteURL(value)); },
                  get: linkHrefDescriptor.get, configurable: true, enumerable: true,
                });

                const mediaSrcDescriptor = Object.getOwnPropertyDescriptor(HTMLMediaElement.prototype, 'src');
                Object.defineProperty(HTMLMediaElement.prototype, 'src', {
                  set(value) { mediaSrcDescriptor.set.call(this, rewriteURL(value)); },
                  get: mediaSrcDescriptor.get, configurable: true, enumerable: true,
                });

                const originalFetch = window.fetch;
                window.fetch = function(resource, init) {
                  if (typeof resource === "string") resource = rewriteURL(resource);
                  else if (resource instanceof Request) resource = new Request(rewriteURL(resource.url), resource);
                  return originalFetch.call(this, resource, init);
                };

                const originalOpen = XMLHttpRequest.prototype.open;
                XMLHttpRequest.prototype.open = function(method, url, ...rest) {
                  return originalOpen.call(this, method, rewriteURL(url), ...rest);
                };

                const OriginalAudio = window.Audio;
                window.Audio = function(src) {
                  const audio = new OriginalAudio();
                  if (src) audio.src = rewriteURL(src);
                  return audio;
                };
                window.Audio.prototype = OriginalAudio.prototype;

                function rewriteURL(original) {
                  var trimmed = original.split("/").pop();
                  if (trimmed.includes("?")) trimmed = trimmed.split("?")[0];
                  return blobUrlss[trimmed] || original;
                }

                const container = document.querySelector("#unity-container");
                const canvas = document.querySelector("#unity-canvas");
                const loadingCover = document.querySelector("#loading-cover");
                const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
                const progressBarFull = document.querySelector("#unity-progress-bar-full");
                const spinner = document.querySelector('.spinner');

                const buildUrl = "Build";
                const loaderUrl = buildUrl + "/29ad73b296bbd9b503bac5b115873c24.loaderr.js";
                const config = {
                  dataUrl: buildUrl + "/377cdd392655e67e31ec74d2b36ecd2f.data.unityweb",
                  frameworkUrl: buildUrl + "/b73ecc4533c4192af04360e3f7833f8c.framework.js.unityweb",
                  codeUrl: buildUrl + "/25e018f3026d2d0ab943454002e5b48a.wasm.unityweb",
                  streamingAssetsUrl: "StreamingAssets",
                  companyName: "Salted Caramel Games",
                  productName: "Sandbox City",
                  productVersion: "6.40"
                };

                loadingCover.style.display = "";

                var gameInstance;
                var script = document.createElement("script");
                script.src = loaderUrl;
                script.onload = () => {
                  createUnityInstance(canvas, config, (progress) => {
                    if (spinner) spinner.style.display = "none";
                    if (progressBarEmpty) progressBarEmpty.style.display = "";
                    if (progressBarFull) progressBarFull.style.width = 100 * progress + "%";
                  }).then((unityInstance) => {
                    gameInstance = unityInstance;
                    loadingCover.style.display = "none";
                  }).catch((message) => {
                    console.error(message);
                  });
                };
                document.body.appendChild(script);

                function setFocus() { container.focus(); window.focus(); canvas.focus(); }
                window.addEventListener("touchstart", () => { setFocus(); });
                window.addEventListener("pointerdown", () => { setFocus(); });
                window.addEventListener("resize", () => { setFocus(); });
              });
            </script>
          </body>
</html>
