<!DOCTYPE html><html lang="en-us"><head>
<base href="https://cdn.jsdelivr.net/gh/laparda14/Ragdoll-archers@62504c9570ea720c6367e7debe1e110c68f77c2d/vs/">
<script>
          const __originalURL = window.URL;
          window.URL = function(url, base) {
            if (base && (base === 'about:srcdoc' || base.includes('about:srcdoc') || base.startsWith('blob:'))) {
              base = document.baseURI;
            }
            try { return new __originalURL(url, base); } catch (e) {
              if (base) return new __originalURL(url, document.baseURI);
              throw e;
            }
          };
          window.URL.createObjectURL = __originalURL.createObjectURL;
          window.URL.revokeObjectURL = __originalURL.revokeObjectURL;
</script>
<script src="gameloader-helper.js"></script>
<meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ragdoll Archers</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/bubbls/ruffle@04dd5345a30d6ebf4b0e2cc385568750cd56ed5a/styyyle.css">
<style>body{margin:0;overflow:hidden;background:#000;}</style>
</head>
<body>
<div id="unity-container" class="unity-desktop" style="width:100%;height:100%;">
<canvas id="unity-canvas" style="width:100%;height:100%;"></canvas>
</div>
<div id="loading-cover">
<div id="unity-loading-bar">
<div id="unity-logo"><img src="logo.jpeg"></div>
<div class="progress-spinner-container">
<div class="spinner-left"><img src="spinner.png"></div>
<div id="unity-progress-bar-empty">
<div id="unity-progress-bar-full"></div>
</div>
<div class="spinner-right"><img src="spinner.png"></div>
</div>
</div>
</div>
<script>
            const buildUrl = "Build";
            const loaderUrl = "https://cdn.jsdelivr.net/gh/bubbls/ruffle@7117cc5006472d782b65d96abd375597d6273242/v11121212.js";
            const config = {
              dataUrl: "https://cdn.jsdelivr.net/gh/bubbls/ruffle@04dd5345a30d6ebf4b0e2cc385568750cd56ed5a/6697b6deba8b617c67b69c55dcd07cb1.data.unityweb",
              frameworkUrl: "https://cdn.jsdelivr.net/gh/bubbls/ruffle@04dd5345a30d6ebf4b0e2cc385568750cd56ed5a/0be3c3ee7115b26e1ae28e643afdf1f2.js.unityweb",
              codeUrl: "https://cdn.jsdelivr.net/gh/bubbls/ruffle@04dd5345a30d6ebf4b0e2cc385568750cd56ed5a/b3397c29f6878557c1c614cbf9e196ea.wasm.unityweb",
              streamingAssetsUrl: "https://cdn.jsdelivr.net/gh/laparda14/Ragdoll-archers@62504c9570ea720c6367e7debe1e110c68f77c2d/vs/StreamingAssets",
              companyName: "Ericetto",
              productName: "Ragdoll Archers",
              productVersion: "0.1",
            };

            const container = document.querySelector("#unity-container");
            const canvas = document.querySelector("#unity-canvas");
            const loadingCover = document.querySelector("#loading-cover");
            const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
            const progressBarFull = document.querySelector("#unity-progress-bar-full");

            if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
              container.className = "unity-mobile";
            }

            loadingCover.style.display = "";

            const unityLoader = document.createElement("script");
            unityLoader.src = loaderUrl;
            unityLoader.onload = () => {
              createUnityInstance(canvas, config, (progress) => {
                progressBarEmpty.style.display = "";
                progressBarFull.style.width = `${100 * progress}%`;
              }).then((unityInstance) => {
                window.unityInstance = unityInstance;
                loadingCover.style.display = "none";
              }).catch((message) => {
                console.error(message);
                // Force close loading cover despite non-fatal errors
                loadingCover.style.display = "none";
              });
            };
            document.body.appendChild(unityLoader);

            document.addEventListener("pointerdown", () => {
              container.focus();
              window.focus();
              canvas.focus();
            });
</script>
</body></html>
